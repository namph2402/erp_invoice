services:
  erp_e_invoice.warehouse_service:
    class: Drupal\erp_e_invoice\WarehouseService
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@logger.factory'

  erp_e_invoice.invoice_service:
    class: Drupal\erp_e_invoice\InvoiceService
    arguments:
      - '@entity_type.manager'
      - '@current_user'
      - '@messenger'
      - '@e_invoice.get_config'
      - '@database'
      - '@keyvalue'
      - '@logger.factory'
      - '@erp_e_invoice.warehouse_service'
