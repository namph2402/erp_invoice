# Hóa đơn đầu ra.
erp_e_invoice.e_invoice_list_out:
  path: '/accountant/e-invoice-out'
  defaults:
    _title: 'List invoice out'
    _controller: 'Drupal\erp_e_invoice\Controller\InvoiceOutController::listInvoiceOut'
  requirements:
    _permission: "administer invoice"

erp_e_invoice.e_invoice_tempaltes:
  path: '/accountant/e-invoice-tempaltes/{company_id}'
  defaults:
    _title: 'Issue invoice out'
    _controller: 'Drupal\erp_e_invoice\Controller\InvoiceOutController::getTemplates'
  requirements:
    _permission: "administer invoice"

erp_e_invoice.e_invoice_create:
  path: '/accountant/create-invoice/{order_id}'
  defaults:
    _title: 'Create invoice'
    _controller: 'Drupal\erp_e_invoice\Controller\InvoiceOutController::createInvoice'
  methods: [POST]
  requirements:
    _permission: 'administer invoice'
    _csrf_token: 'TRUE'

erp_e_invoice.e_invoice_import:
  path: '/accountant/import-invoice'
